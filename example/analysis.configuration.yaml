# NGS.analysis v3 example project configuration
name: Eugenio.RNA
pep_version: 2.1.0
sample_table: sample.table.csv
# pipeline run mode: genes | repeats
pipeline_mode: genes

sample_modifiers:
  derive:
    attributes: [read1, read2]
    sources:
      # folder with the FASTQ files of this project
      R1: "/store24/project24/becgsc_001/coding/NGS.analysis.v3/example/{fastq1}"
      R2: "/store24/project24/becgsc_001/coding/NGS.analysis.v3/example/{fastq2}"
  imply:
    - if:
        protocol: RNA
      then:
        strandedness: reverse
    # genome resources (indices, annotation, blacklist, ...) come from <v3>/genomes/<genome>.yaml
    - if:
        organism: ["mouse", "mm10", "Mouse"]
      then:
        genome: mm10
    - if:
        organism: ["human", "hg38", "Human"]
      then:
        genome: hg38
# optional: IGV path rewrite for the BigWig session file (default shown)
# igv_path_map:
#   "/store24/project24/": "X:/"
