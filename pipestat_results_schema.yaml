# NGS.analysis v3 sample-level results. Units: see docs/stats_units.md (counts in fragments, % on 0-100).
pipeline_name: NGS.analysis
samples:
  File_mb:
    type: number
    description: Input FASTQ size [MB]
  Raw_reads:
    type: string
    description: 'Raw reads from pypiper check_fastq [READS: PE counts both mates]'
  Fastq_reads:
    type: number
    description: 'FASTQ reads after merge/conversion (pypiper) [READS: PE counts both mates]'
  PF_reads:
    type: string
    description: Pass-filter reads (pypiper, BAM input only) [READS]
  Trim_input_fragments:
    type: number
    description: 'Input to Trimmomatic [fragments (PE: read pairs; SE: reads)]'
  Trimmed_fragments:
    type: number
    description: 'Surviving trimming (PE: both mates) [fragments (PE: read pairs; SE: reads)]'
  Trim_R1_only_fragments:
    type: number
    description: 'PE only: only R1 survived (not aligned) [pairs]'
  Trim_R2_only_fragments:
    type: number
    description: 'PE only: only R2 survived (not aligned) [pairs]'
  Trim_dropped_fragments:
    type: number
    description: 'Dropped by Trimmomatic [fragments (PE: read pairs; SE: reads)]'
  Trimmed_pct:
    type: number
    description: Trimmed_fragments / Trim_input_fragments [%]
  Aligned_fragments:
    type: number
    description: 'Aligned (bowtie2: primary R1 mapped; STAR: unique + multi, excl. too-many-loci) [fragments (PE: read pairs; SE: reads)]'
  Unique_fragments:
    type: number
    description: 'Uniquely aligned (bowtie2: MAPQ>=30; STAR: unique) [fragments (PE: read pairs; SE: reads)]'
  Multimapped_fragments:
    type: number
    description: 'STAR only: mapped to multiple loci [fragments (PE: read pairs; SE: reads)]'
  Too_many_loci_fragments:
    type: number
    description: 'STAR only: too many loci, NOT in the BAM [fragments (PE: read pairs; SE: reads)]'
  Unmapped_fragments:
    type: number
    description: 'STAR only: input - aligned [fragments (PE: read pairs; SE: reads)]'
  Aligned_proper_pairs:
    type: number
    description: 'bowtie2 PE only: properly paired primary alignments [pairs]'
  Alignment_pct:
    type: number
    description: Aligned / input to the aligner (Trimmed_fragments) [%]
  Unique_pct:
    type: number
    description: Unique / input to the aligner [%]
  Multimapped_pct:
    type: number
    description: 'STAR only: multimapped / input [%]'
  Mito_fragments:
    type: number
    description: 'Primary aligned on the mitochondrial chromosome [fragments (PE: read pairs; SE: reads)]'
  Mito_pct:
    type: number
    description: Mito_fragments / Aligned_fragments [%]
  Duplicate_fragments:
    type: number
    description: 'Picard duplicates [fragments (PE: read pairs; SE: reads)]'
  Optical_duplicate_fragments:
    type: number
    description: Picard optical duplicates, PE [pairs]
  Duplication_pct:
    type: number
    description: Picard PERCENT_DUPLICATION x 100 [%]
  Filtered_fragments:
    type: number
    description: 'In the analysis BAM (genes: .filt.bam; repeats: .dedup.unique.bam, duplicates marked but retained) [fragments (PE: read pairs; SE: reads)]'
  Filtered_nondup_fragments:
    type: number
    description: 'repeats mode: .dedup.unique.bam without duplicates [fragments (PE: read pairs; SE: reads)]'
  Filtered_pct:
    type: number
    description: 'genes mode: Filtered_fragments / Trimmed_fragments [%]'
  Insert_size_median:
    type: number
    description: Median |TLEN| of proper pairs in the analysis BAM [bp]
  Insert_size_mode:
    type: number
    description: Mode |TLEN| [bp]
  Insert_lt150_pct:
    type: number
    description: Fragments < 150 bp [%]
  Insert_150_300_pct:
    type: number
    description: Fragments 150-299 bp [%]
  Insert_ge300_pct:
    type: number
    description: Fragments >= 300 bp [%]
  NRF:
    type: number
    description: Non-redundant fraction (distinct/total positions, unique fragments, before duplicate removal)
  PBC1:
    type: number
    description: PCR bottlenecking coefficient 1 (M1/distinct)
  PBC2:
    type: number
    description: PCR bottlenecking coefficient 2 (M1/M2)
  TSS_score:
    type: number
    description: TSS enrichment (flank-normalised Tn5 insertion profile, ATAC)
  Peak_mode:
    type: string
    description: 'MACS3 mode used: narrow, broad or none'
  Peaks_n:
    type: number
    description: Peaks after blacklist removal
  FRiP_pct:
    type: number
    description: Fragments in peaks / usable fragments of the analysis BAM [%]
  Read_type:
    type: string
    description: single or paired
  Genome:
    type: string
    description: genome assembly
  Protocol:
    type: string
    description: CHIP, ATAC, CR, CT or RNA
  Pipeline_mode:
    type: string
    description: genes or repeats
  Pipeline_version:
    type: string
    description: NGS.analysis version
  FastQC report r1:
    type: object
    object_type: file
    properties:
      path:
        type: string
        description: Path to the file.
      title:
        type: string
        description: Title of the file.
    required:
    - path
    - title
    description: FastQC report r1
  FastQC report r2:
    type: object
    object_type: file
    properties:
      path:
        type: string
        description: Path to the file.
      title:
        type: string
        description: Title of the file.
    required:
    - path
    - title
    description: FastQC report r2
  FastQC report trim r1:
    type: object
    object_type: file
    properties:
      path:
        type: string
        description: Path to the file.
      title:
        type: string
        description: Title of the file.
    required:
    - path
    - title
    description: FastQC report trim r1
  FastQC report trim r2:
    type: object
    object_type: file
    properties:
      path:
        type: string
        description: Path to the file.
      title:
        type: string
        description: Title of the file.
    required:
    - path
    - title
    description: FastQC report trim r2
  BAM_mapped:
    type: object
    object_type: file
    properties:
      path:
        type: string
        description: Path to the file.
      title:
        type: string
        description: Title of the file.
    required:
    - path
    - title
    description: All alignments, coordinate-sorted (duplicates not marked)
  BAM_dedup_unique:
    type: object
    object_type: file
    properties:
      path:
        type: string
        description: Path to the file.
      title:
        type: string
        description: Title of the file.
    required:
    - path
    - title
    description: 'repeats mode: unique (MAPQ 255) alignments, duplicates MARKED not removed (v2 definition)'
  BAM_filtered:
    type: object
    object_type: file
    properties:
      path:
        type: string
        description: Path to the file.
      title:
        type: string
        description: Title of the file.
    required:
    - path
    - title
    description: 'genes mode chromatin: proper pairs, duplicates removed, MAPQ>=30, canonical chromosomes, no mito, blacklist removed'
  BigWig:
    type: object
    object_type: file
    properties:
      path:
        type: string
        description: Path to the file.
      title:
        type: string
        description: Title of the file.
    required:
    - path
    - title
    description: 'RNA genes mode: RPKM, all alignments'
  BigWig_dedup:
    type: object
    object_type: file
    properties:
      path:
        type: string
        description: Path to the file.
      title:
        type: string
        description: Title of the file.
    required:
    - path
    - title
    description: 'repeats mode: RPKM from .dedup.unique.bam (v2)'
  BigWig_filtered:
    type: object
    object_type: file
    properties:
      path:
        type: string
        description: Path to the file.
      title:
        type: string
        description: Title of the file.
    required:
    - path
    - title
    description: 'genes mode chromatin: CPM, fragment-extended, from .filt.bam'
  BigWig_filtered_nuc:
    type: object
    object_type: file
    properties:
      path:
        type: string
        description: Path to the file.
      title:
        type: string
        description: Title of the file.
    required:
    - path
    - title
    description: 'CR/CT genes mode: fragments >= 120 bp, CPM'
  BigWig_filtered_subnuc:
    type: object
    object_type: file
    properties:
      path:
        type: string
        description: Path to the file.
      title:
        type: string
        description: Title of the file.
    required:
    - path
    - title
    description: 'CR/CT genes mode: fragments < 120 bp, CPM'
  RSEM_genes_results:
    type: object
    object_type: file
    properties:
      path:
        type: string
        description: Path to the file.
      title:
        type: string
        description: Title of the file.
    required:
    - path
    - title
    description: RSEM per-gene results
  RSEM_isoforms_results:
    type: object
    object_type: file
    properties:
      path:
        type: string
        description: Path to the file.
      title:
        type: string
        description: Title of the file.
    required:
    - path
    - title
    description: RSEM per-isoform results
  Peaks:
    type: object
    object_type: file
    properties:
      path:
        type: string
        description: Path to the file.
      title:
        type: string
        description: Title of the file.
    required:
    - path
    - title
    description: MACS3 peaks, blacklist removed
  TSS enrichment:
    type: object
    object_type: image
    properties:
      path:
        type: string
        description: Path to the image.
      thumbnail_path:
        type: string
        description: Path to the thumbnail.
      title:
        type: string
        description: Title of the image.
    required:
    - path
    - thumbnail_path
    - title
    description: TSS enrichment profile (ATAC)
  Insert size distribution:
    type: object
    object_type: image
    properties:
      path:
        type: string
        description: Path to the image.
      thumbnail_path:
        type: string
        description: Path to the thumbnail.
      title:
        type: string
        description: Title of the image.
    required:
    - path
    - thumbnail_path
    - title
    description: Fragment length distribution (PE)
  Time:
    type: string
    description: time
  Success:
    type: string
    description: success
