# NGS.analysis v3 tool configuration (pypiper). Bare names resolve in the ngs.v3 environment: the pipeline puts
# the directory of its python interpreter first on PATH.
tools:
  java: java
  python: python
  samtools: samtools
  bedtools: bedtools
  bowtie2: bowtie2
  STAR: STAR
  rsem: rsem-calculate-expression
  fastqc: fastqc
  featureCounts: featureCounts
  trimmomatic: trimmomatic
  picard: picard
  bamcoverage: bamCoverage
  macs3: macs3
  Rscript: Rscript

resources: {}
parameters: {}
