# NGS.analysis v3 project pipeline (collation). Own pipeline_name -> own schema, flags and record.
pipeline_name: NGS.analysis.project
output_schema: pipestat_project_results_schema.yaml

project_interface:
  var_templates:
    project_name: "{project.name}"
    record_identifier: "{project.name}"
  command_template: >
    /store24/project24/becgsc_001/micromamba/envs/ngs.v3/bin/python3 {looper.piface_dir}/NGS.analysis.collator.py
    --config {looper.pep_config}
    -O {looper.output_dir}
    -P {compute.cores}
    -M {compute.mem}
    -n {project.name}
    -r {looper.output_dir}/samples
    --pipestat-config {pipestat.config_file}

compute:
  mem: 20G
  cores: 8
  partition: slim16
  time: 02:00:00
